# Home Assistant mit dieser Integration, direkt aus dem Repo betrieben.
#
# Der Kern: das Repo wird in den Container gemountet. Bearbeiten, Ausprobieren und
# Versionieren passieren dadurch am selben Ort - es gibt keine zweite Kopie, die
# auseinanderlaufen kann. Was in custom_components/smart_homeassistant/ steht, ist
# genau das, was Home Assistant laedt (nach `docker compose restart homeassistant`).
#
# Starten:      docker compose up -d
# Neu laden:    docker compose restart homeassistant
# Oberflaeche:  http://localhost:8123
#
# ./config wird beim ersten Start angelegt und enthaelt die Laufzeitdaten:
# secrets.yaml, die Datenbank und .storage/ mit den API-Keys der Modell-Anbindungen
# im Klartext. Es ist in .gitignore ausgenommen und gehoert nicht ins Repo.

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable   # getestet mit 2026.6.4
    restart: unless-stopped
    environment:
      TZ: Europe/Vienna
    ports:
      - "8123:8123"
    volumes:
      # Eigenes, nicht versioniertes Konfigurationsverzeichnis
      - ./config:/config
      # Die Integration aus diesem Repo direkt hineinreichen. Bewusst schreibbar und
      # NICHT ":ro": der Dienst smart_homeassistant.refresh_documentation schreibt den
      # Offline-Doku-Schnappschuss nach homeassistant_docs_offline.md zurueck, also in
      # genau dieses Verzeichnis.
      - ./custom_components/smart_homeassistant:/config/custom_components/smart_homeassistant

  # Optional: lokales Modell. Ohne diesen Dienst laesst sich stattdessen ein
  # Cloud-Provider (OpenAI-kompatibel, Anthropic, Gemini) im Chat-Fenster hinterlegen.
  ollama:
    container_name: smartha-ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
